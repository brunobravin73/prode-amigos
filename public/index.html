<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode con Amigos - Ingreso</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-6 border border-gray-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-green-400">⚽ Prode Amigos</h1>
            <p class="text-gray-400 mt-2" id="form-subtitle">Ingresá a tu cuenta para jugar</p>
        </div>

        <div id="alert-box" class="hidden p-3 rounded-lg mb-4 text-sm text-center font-semibold"></div>

        <form id="auth-form" class="space-y-4">
            <div id="group-nombre" class="hidden">
                <label class="block text-sm font-medium text-gray-300 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-green-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Correo Electrónico</label>
                <input type="email" id="email" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-green-400">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Contraseña</label>
                <input type="password" id="password" required class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-green-400">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-green-500 hover:bg-green-600 text-gray-900 font-bold p-3 rounded-lg transition duration-200">
                Ingresar
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-gray-400">
            <span id="toggle-text">¿No tenés cuenta?</span>
            <button id="btn-toggle" class="text-green-400 font-semibold hover:underline ml-1">Registrate acá</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('auth-form');
        const btnToggle = document.getElementById('btn-toggle');
        const btnSubmit = document.getElementById('btn-submit');
        const groupNombre = document.getElementById('group-nombre');
        const formSubtitle = document.getElementById('form-subtitle');
        const toggleText = document.getElementById('toggle-text');
        const alertBox = document.getElementById('alert-box');

        let modoRegistro = false;

        btnToggle.addEventListener('click', () => {
            modoRegistro = !modoRegistro;
            if (modoRegistro) {
                groupNombre.classList.remove('hidden');
                document.getElementById('nombre').required = true;
                formSubtitle.innerText = 'Creá tu cuenta para empezar a sumar puntos';
                btnSubmit.innerText = 'Registrarme';
                toggleText.innerText = '¿Ya tenés cuenta?';
                btnToggle.innerText = 'Iniciá sesión';
            } else {
                groupNombre.classList.add('hidden');
                document.getElementById('nombre').required = false;
                formSubtitle.innerText = 'Ingresá a tu cuenta para jugar';
                btnSubmit.innerText = 'Ingresar';
                toggleText.innerText = '¿No tenés cuenta?';
                btnToggle.innerText = 'Registrate acá';
            }
            alertBox.classList.add('hidden');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nombre = document.getElementById('nombre').value;

            if (modoRegistro) {
                try {
                    const res = await fetch('/api/registro', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nombre, email, password })
                    });
                    const data = await res.json();

                    if (data.status === 'success') {
                        mostrarAlerta('¡Registro exitoso! Ya podés iniciar sesión.', 'bg-green-500/20 text-green-400');
                        btnToggle.click();
                    } else {
                        mostrarAlerta('Error: ' + data.message, 'bg-red-500/20 text-red-400');
                    }
                } catch (err) {
                    mostrarAlerta('Error de conexión con el servidor.', 'bg-red-500/20 text-red-400');
                }
            } else {
                try {
                    mostrarAlerta('Ingresando...', 'bg-blue-500/20 text-blue-400');
                    
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();

                    if (data.status === 'success') {
                        localStorage.setItem('usuario_id', data.usuario.id);
                        localStorage.setItem('usuario_nombre', data.usuario.nombre);
                        
                        mostrarAlerta('¡Ingreso exitoso! Redireccionando...', 'bg-green-500/20 text-green-400');
                        
                        setTimeout(() => {
                            alert(`¡Bienvenido ${data.usuario.nombre}! ID: ${data.usuario.id}`);
                        }, 500);
                        
                    } else {
                        mostrarAlerta(data.message, 'bg-red-500/20 text-red-400');
                    }
                } catch (err) {
                    mostrarAlerta('Error de conexión con el servidor.', 'bg-red-500/20 text-red-400');
                }
            }
        });

        function mostrarAlerta(mensaje, clases) {
            alertBox.innerText = mensaje;
            alertBox.className = `p-3 rounded-lg mb-4 text-sm text-center font-semibold ${clases}`;
        }
    </script>
</body>
</html>
