<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode con Amigos - Fixture</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md">
        <div class="flex justify-between items-center mb-6 bg-gray-800 p-4 rounded-xl border border-gray-700">
            <div>
                <p class="text-xs text-gray-400">Jugador</p>
                <h2 class="text-xl font-bold text-green-400" id="nombre-jugador">...</h2>
            </div>
            <a href="/posiciones.html" class="bg-blue-600 hover:bg-blue-700 text-xs font-bold py-2 px-3 rounded-lg transition">
                🏆 Posiciones
            </a>
        </div>

        <h3 class="text-lg font-bold mb-4 text-gray-300">Próximos Partidos</h3>

        <div id="alert-fixture" class="hidden p-3 rounded-lg mb-4 text-sm text-center font-semibold"></div>

        <div id="contenedor-partidos" class="space-y-4">
            <p class="text-center text-gray-500 py-4">Cargando partidos...</p>
        </div>
    </div>

    <script>
        // 1. Verificar si el usuario está logueado
        const usuarioId = localStorage.getItem('usuario_id');
        const usuarioNombre = localStorage.getItem('usuario_nombre');

        if (!usuarioId) {
            window.location.href = '/';
        } else {
            // Asignamos el nombre de usuario de la memoria al elemento HTML
            document.getElementById('nombre-jugador').innerText = usuarioNombre;
        }

        const alertFixture = document.getElementById('alert-fixture');
        const contenedor = document.getElementById('contenedor-partidos');

// 2. Cargar los partidos desde la API de Python
        async function cargarPartidos() {
            try {
                const res = await fetch(`/api/partidos?usuario_id=${usuarioId}`);
                const data = await res.json();

                if (data.status === 'success' && data.partidos.length > 0) {
                    contenedor.innerHTML = ''; // Limpiamos el "Cargando..."
                    
                    data.partidos.forEach(partido => {
                        const fecha = new Date(partido.fecha_partido).toLocaleString('es-AR', {
                            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
                        });

                        const esFinalizado = partido.estado === 'finalizado';
                        const tieneVoto = partido.voto_local !== "";
                        
                        const valorLocal = esFinalizado ? (partido.goles_local_real ?? 0) : (tieneVoto ? partido.voto_local : 0);
                        const valorVisitante = esFinalizado ? (partido.goles_visitante_real ?? 0) : (tieneVoto ? partido.voto_visitante : 0);

                        const inputAtributos = esFinalizado 
                            ? 'disabled class="w-12 p-2 rounded-lg bg-gray-800 border border-gray-700 text-center font-black text-lg text-green-400"' 
                            : `onchange="autoGuardar(${partido.id})" class="w-12 p-2 rounded-lg bg-gray-700 border border-gray-600 text-center font-bold text-lg text-white focus:outline-none focus:border-green-400"`;
                        
                        let footerHtml = '';
                        if (esFinalizado) {
                            const pronoTexto = tieneVoto ? `${partido.voto_local} x ${partido.voto_visitante}` : 'No apostaste';
                            footerHtml = `
                                <div class="mt-3 pt-3 border-t border-gray-700/50 flex justify-between items-center text-xs text-gray-400">
                                    <span>🏁 Partido Finalizado</span>
                                    <span class="bg-gray-700/40 px-2 py-1 rounded text-gray-300 font-medium">Tu prode: <strong class="text-amber-400">${pronoTexto}</strong></span>
                                </div>`;
                        } else {
                            footerHtml = `
                                <div class="mt-3 pt-2 flex justify-end items-center h-5">
                                    <span id="status-${partido.id}" class="text-[11px] font-medium text-gray-500 transition-all duration-300">
                                        ${tieneVoto ? '✓ Guardado' : '✍️ Pendiente de cambio'}
                                    </span>
                                </div>`;
                        }

                        const tarjeta = document.createElement('div');
                        tarjeta.className = "bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-md transition duration-200";
                        tarjeta.id = `tarjeta-${partido.id}`;
                        tarjeta.innerHTML = `
                            <div class="text-center text-xs text-gray-400 mb-3 font-medium">${fecha} hs</div>
                            
                            <div class="flex items-center justify-between gap-2">
                                <div class="w-1/3 text-right font-semibold text-sm truncate">${partido.equipo_local}</div>
                                
                                <div class="flex items-center justify-center gap-2 w-1/3">
                                    <input type="number" id="local-${partido.id}" min="0" value="${valorLocal}" ${inputAtributos}>
                                    <span class="text-gray-500 font-bold">x</span>
                                    <input type="number" id="visitante-${partido.id}" min="0" value="${valorVisitante}" ${inputAtributos}>
                                </div>
                                
                                <div class="w-1/3 text-left font-semibold text-sm truncate">${partido.equipo_visitante}</div>
                            </div>
                            
                            ${footerHtml}
                        `;
                        contenedor.appendChild(tarjeta);
                    });
                } else {
                    contenedor.innerHTML = '<p class="text-center text-gray-500 py-4">No hay partidos cargados por el momento.</p>';
                }
            } catch (err) {
                contenedor.innerHTML = '<p class="text-center text-red-400 py-4">Error al conectar con el servidor.</p>';
            }
        }

        // Nueva función de guardado automático y silencioso
        async function autoGuardar(partidoId) {
            const gLocal = document.getElementById(`local-${partidoId}`).value;
            const gVisitante = document.getElementById(`visitante-${partidoId}`).value;
            const statusLabel = document.getElementById(`status-${partidoId}`);
            const tarjeta = document.getElementById(`tarjeta-${partidoId}`);

            if (gLocal === '' || gVisitante === '') return;

            statusLabel.innerText = "Guardando...";
            statusLabel.className = "text-[11px] font-medium text-blue-400 animate-pulse";

            try {
                const res = await fetch(`/api/pronostico?usuario_id=${usuarioId}&partido_id=${partidoId}&goles_local_prediccion=${gLocal}&goles_visitante_prediccion=${gVisitante}`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (data.status === 'success') {
                    statusLabel.innerText = "✓ Guardado automáticamente";
                    statusLabel.className = "text-[11px] font-bold text-green-400";
                    
                    tarjeta.classList.remove('border-gray-700');
                    tarjeta.classList.add('border-green-500/50', 'bg-gray-800/90');
                    
                    setTimeout(() => {
                        tarjeta.classList.remove('border-green-500/50', 'bg-gray-800/90');
                        tarjeta.classList.add('border-gray-700');
                        statusLabel.innerText = "✓ Guardado";
                        statusLabel.className = "text-[11px] font-medium text-gray-400";
                    }, 2000);

                } else {
                    statusLabel.innerText = "❌ Error al guardar";
                    statusLabel.className = "text-[11px] font-bold text-red-400";
                }
            } catch (err) {
                statusLabel.innerText = "❌ Error de conexión";
                statusLabel.className = "text-[11px] font-bold text-red-400";
            }
        }

        function mostrarAlerta(mensaje, clases) {
            alertFixture.innerText = mensaje;
            alertFixture.className = `p-3 rounded-lg mb-4 text-sm text-center font-semibold ${clases}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        cargarPartidos();
    </script>
</body>
</html>
