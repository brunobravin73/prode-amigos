<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prode con Amigos - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md space-y-6">
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
            <h2 class="text-xl font-bold text-red-400">⚙️ Panel Administrador</h2>
            <p class="text-xs text-gray-400 mt-1">Gestión integral del Torneo</p>
        </div>

        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-2">
            <label class="block text-xs font-semibold text-gray-400 uppercase">Clave Secreta Admin</label>
            <input type="password" id="clave-admin" placeholder="Ingresá la contraseña secreta" 
                class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 font-mono text-white text-sm focus:outline-none focus:border-red-400">
        </div>

        <div id="alert-admin" class="hidden p-3 rounded-lg text-sm text-center font-semibold"></div>

        <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-xl space-y-3">
            <h3 class="text-sm font-bold text-green-400 uppercase tracking-wider mb-2">🆕 Crear Nuevo Partido</h3>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase">Local (Ej: 🇦🇷 Argentina)</label>
                    <input type="text" id="nuevo-local" placeholder="Equipo Local" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-400 uppercase">Visitante (Ej: 🇧🇷 Brasil)</label>
                    <input type="text" id="nuevo-visitante" placeholder="Equipo Visitante" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-sm text-white focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-[10px] text-gray-400 uppercase">Fecha y Hora del Encuentro</label>
                <input type="datetime-local" id="nuevo-fecha" class="w-full p-2 rounded-lg bg-gray-700 border border-gray-600 text-sm text-white focus:outline-none">
            </div>

            <button onclick="crearPartido()" class="w-full bg-green-600 hover:bg-green-700 text-xs font-bold py-2 rounded-lg transition duration-200 shadow-md">
                ➕ Insertar Partido al Fixture
            </button>
        </div>

        <div class="space-y-4">
            <h3 class="text-sm font-bold text-gray-300 uppercase tracking-wider text-xs">🔒 Partidos por Cerrar</h3>
            <div id="contenedor-admin" class="space-y-4">
                <p class="text-center text-gray-500 py-4">Buscando partidos pendientes...</p>
            </div>
        </div>
    </div>

    <script>
        const contenedor = document.getElementById('contenedor-admin');
        const alertAdmin = document.getElementById('alert-admin');

        async function cargarPartidosPendientes() {
            try {
                const res = await fetch('/api/partidos');
                const data = await res.json();

                if (data.status === 'success') {
                    const pendientes = data.partidos.filter(p => p.estado === 'pendiente');

                    if (pendientes.length > 0) {
                        contenedor.innerHTML = '';
                        pendientes.forEach(partido => {
                            const tarjeta = document.createElement('div');
                            tarjeta.className = "bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-lg";
                            tarjeta.innerHTML = `
                                <div class="flex items-center justify-between gap-2">
                                    <div class="w-1/3 text-right font-bold text-sm truncate text-gray-200">${partido.equipo_local}</div>
                                    
                                    <div class="flex items-center justify-center gap-2 w-1/3">
                                        <input type="number" id="real-local-${partido.id}" min="0" placeholder="0" 
                                            class="w-12 p-2 rounded-lg bg-gray-700 border border-red-500/40 text-center font-extrabold text-lg text-white focus:outline-none">
                                        <span class="text-gray-500 font-bold">x</span>
                                        <input type="number" id="real-visitante-${partido.id}" min="0" placeholder="0" 
                                            class="w-12 p-2 rounded-lg bg-gray-700 border border-red-500/40 text-center font-extrabold text-lg text-white focus:outline-none">
                                    </div>
                                    
                                    <div class="w-1/3 text-left font-bold text-sm truncate text-gray-200">${partido.equipo_visitante}</div>
                                </div>
                                <button onclick="finalizarPartido(${partido.id})" 
                                    class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded-lg transition duration-200">
                                    🔒 Guardar Resultado y Calcular Puntos
                                </button>
                            `;
                            contenedor.appendChild(tarjeta);
                        });
                    } else {
                        contenedor.innerHTML = '<div class="text-center text-gray-500 py-8 bg-gray-800 rounded-xl border border-gray-700/50">🎉 ¡No hay partidos pendientes por cerrar!</div>';
                    }
                }
            } catch (err) {
                contenedor.innerHTML = '<p class="text-center text-red-400 py-4">Error al conectar con la API.</p>';
            }
        }

        async function crearPartido() {
            alertAdmin.classList.add('hidden');
            const clave = document.getElementById('clave-admin').value;
            const local = document.getElementById('nuevo-local').value.trim();
            const visitante = document.getElementById('nuevo-visitante').value.trim();
            const fecha = document.getElementById('nuevo-fecha').value;

            if (!clave || !local || !visitante || !fecha) {
                mostrarAlerta('Por favor completá todos los campos de creación y la clave de admin.', 'bg-yellow-500/20 text-yellow-400');
                return;
            }

            try {
                const res = await fetch(`/api/crear-partido?equipo_local=${encodeURIComponent(local)}&equipo_visitante=${encodeURIComponent(visitante)}&fecha_partido=${encodeURIComponent(fecha)}&clave_admin=${clave}`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (data.status === 'success') {
                    mostrarAlerta('¡Partido creado exitosamente en el fixture!', 'bg-green-500/20 text-green-400');
                    // Limpiamos el formulario
                    document.getElementById('nuevo-local').value = '';
                    document.getElementById('nuevo-visitante').value = '';
                    document.getElementById('nuevo-fecha').value = '';
                    // Recargamos la lista inferior de pendientes
                    cargarPartidosPendientes();
                } else {
                    mostrarAlerta('Error: ' + data.message, 'bg-red-500/20 text-red-400');
                }
            } catch (err) {
                mostrarAlerta('Error de red al intentar crear el partido.', 'bg-red-500/20 text-red-400');
            }
        }

        async function finalizarPartido(partidoId) {
            alertAdmin.classList.add('hidden');
            const clave = document.getElementById('clave-admin').value;
            const gLocal = document.getElementById(`real-local-${partidoId}`).value;
            const gVisitante = document.getElementById(`real-visitante-${partidoId}`).value;

            if (clave === '' || gLocal === '' || gVisitante === '') {
                mostrarAlerta('Completá los goles reales y la clave secreta.', 'bg-yellow-500/20 text-yellow-400');
                return;
            }

            try {
                const res = await fetch(`/api/calcular-puntos/${partidoId}?goles_local_real=${gLocal}&goles_visitante_real=${gVisitante}&clave_admin=${clave}`, {
                    method: 'POST'
                });
                const data = await res.json();

                if (data.status === 'success') {
                    mostrarAlerta('¡Partido cerrado con éxito! Puntos repartidos.', 'bg-green-500/20 text-green-400');
                    cargarPartidosPendientes();
                } else {
                    mostrarAlerta('Error: ' + data.message, 'bg-red-500/20 text-red-400');
                }
            } catch (err) {
                mostrarAlerta('Error de comunicación con el servidor.', 'bg-red-500/20 text-red-400');
            }
        }

        function mostrarAlerta(mensaje, clases) {
            alertAdmin.innerText = mensaje;
            alertAdmin.className = `p-3 rounded-lg text-sm text-center font-semibold ${clases}`;
        }

        cargarPartidosPendientes();
    </script>
</body>
</html>
